name: CI

on:
  push:
    branches: [ "master", "lab_08" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v2

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]" numpy pytest pytest-cov pytest-benchmark

      - name: Run tests & benchmarks
        run: PYTHONPATH=src pytest --cov=findex --benchmark-enable -v