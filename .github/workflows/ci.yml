name: CI

on:
  push:
    branches: [ "master", "lab_08" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: false

      - name: Check environment
        run: |
          python --version
          uv --version

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests & benchmarks
        run: PYTHONPATH=src uv run pytest --cov=findex --benchmark-enable -v