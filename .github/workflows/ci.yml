name: CI

on:
  push:
    branches: [ "master", "lab_08" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --group dev

      - name: Prepare test corpus and build index
        env:
          PYTHONPATH: src
        run: |
          mkdir -p data docs
          echo "python stream search test document one" > data/doc1.txt
          echo "rare python machine learning document two" > data/doc2.txt
          python -m findex.cli index data --out index.bin

      - name: Run tests & benchmarks
        env:
          PYTHONPATH: src
        run: |
          pytest --cov=findex --benchmark-enable -v
