name: CI

on:
  push:
    branches: [ "master", "lab_04" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          enable-cache: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - name: Install dependencies
        run: uv sync --dev
        
      - name: Check typing (Pyright)
        run: uv run pyright
        
      - name: Run tests & coverage
        run: uv run pytest --cov=findex