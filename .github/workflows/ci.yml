name: CI

on:
  push:
    branches: [ "master", "lab_08" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov pytest-benchmark typer rich fastapi uvicorn hypothesis
          pip install -e .

      - name: Run tests & benchmarks
        env:
          PYTHONPATH: src
        run: |
          pytest --cov=findex --benchmark-enable -v
